<template>
    <lightning-card icon-name="utility:shield">
        <div slot="actions">
            <lightning-button-group>
                <lightning-button
                    label="Scan Org Now"
                    variant="brand"
                    icon-name="utility:refresh"
                    onclick={handleScanClick}
                    disabled={isLoading}
                ></lightning-button>
                <lightning-button
                    label="Export CSV"
                    icon-name="utility:download"
                    onclick={handleExportCsv}
                    disabled={isLoading}
                ></lightning-button>
            </lightning-button-group>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Scanning org..." size="medium"></lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    {errorMessage}
                </div>
            </template>

            <template if:true={showEmptyState}>
                <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center">
                    <p class="slds-text-heading_small">No scan results yet</p>
                    <p class="slds-text-body_regular slds-text-color_weak">
                        Click "Scan Org Now" to analyze user permissions and surface risk.
                    </p>
                </div>
            </template>

            <template if:true={hasLogs}>
                <!-- Overall org risk -->
                <div class="slds-box slds-box_x-small slds-m-bottom_medium risk-summary-box">
                    <div class="slds-grid slds-grid_align-spread slds-wrap">
                        <div>
                            <p class="slds-text-title_caps slds-text-color_weak">Overall Org Risk</p>
                            <span class={overallRiskBadgeClass}>{overallRiskLevel}</span>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                {atRiskUserCount} users at risk · Last scan: {lastScanDateDisplay}
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Risk breakdown -->
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                    <template for:each={riskCounts} for:item="item">
                        <div key={item.level} class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-vertical_x-small">
                            <div class="slds-box slds-box_x-small slds-text-align_center">
                                <span class={item.badgeClass}>{item.level}</span>
                                <p class="slds-text-heading_medium slds-m-top_x-small">{item.count}</p>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Search + filters -->
                <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium slds-grid_vertical-align-end">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-p-vertical_x-small">
                        <lightning-input
                            type="search"
                            label="Search"
                            placeholder="Name, email, or username"
                            value={searchTerm}
                            onchange={handleSearchChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-vertical_x-small">
                        <lightning-combobox
                            label="Role"
                            value={roleFilter}
                            options={roleOptions}
                            onchange={handleRoleFilterChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-vertical_x-small">
                        <lightning-combobox
                            label="Profile"
                            value={profileFilter}
                            options={profileOptions}
                            onchange={handleProfileFilterChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-vertical_x-small">
                        <lightning-combobox
                            label="Severity"
                            value={severityFilter}
                            options={severityOptions}
                            onchange={handleSeverityFilterChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-vertical_x-small">
                        <lightning-input
                            type="checkbox"
                            label="Show All Users"
                            checked={showAllUsers}
                            onchange={handleShowAllUsersChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-vertical_x-small">
                        <lightning-button
                            label="Clear Filters"
                            variant="neutral"
                            onclick={handleClearFilters}
                            disabled={clearFiltersDisabled}
                        ></lightning-button>
                    </div>
                </div>

                <!-- Results table -->
                <p class="slds-text-heading_small slds-m-bottom_x-small">
                    Scan Results ({filteredResults.length})
                </p>

                <template if:true={showNoMatchesState}>
                    <div class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center">
                        <p class="slds-text-heading_small">{noMatchesMessage}</p>
                    </div>
                </template>

                <template if:false={showNoMatchesState}>
                    <c-permission-risk-datatable
                        key-field="id"
                        data={filteredResults}
                        columns={columns}
                        onrowaction={handleRowAction}
                        hide-checkbox-column
                    ></c-permission-risk-datatable>
                </template>
            </template>
        </div>
    </lightning-card>

    <template if:true={selectedLogId}>
        <c-permission-risk-user-detail record-id={selectedLogId} onclose={handleCloseDetail}></c-permission-risk-user-detail>
    </template>
</template>
